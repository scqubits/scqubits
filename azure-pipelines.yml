# Test the built PyPI artifacts on every supported Python version.
trigger:
  branches:
    include:
      - main
      - peterg_versions
      - spc-main-devel
      - jk-devel
      - Danny_vchos
      - devel_peterg
      - peterg_qutip5

variables:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
- job: Linux
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    matrix:
      Python310:
        python.version: '3.10'
      Python311:
        python.version: '3.11'
      Python312:
        python.version: '3.12'
      Python313:
        python.version: '3.13'
      Python314:
        python.version: '3.14'
  steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'
  - script: |
      python -m unittest discover -s tools -p test_ci_package.py
      python -m pip install build pytest pytest-azurepipelines
      python -I tools/ci_package.py pip-build --output "$(Agent.TempDirectory)/scqubits-dist"
    displayName: 'Build sdist and wheel; install wheel with GUI dependencies'
  - script: |
      python -I tools/ci_package.py test --python-version "$(python.version)"
    displayName: 'Verify installed package; run serial and multiprocessing tests'
