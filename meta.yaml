{% set name = "scqubits" %}
{% set version = "5.0.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Local build: use the checkout. For the feedstock, enable url/sha256 and remove path.
  # url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # sha256: REPLACE_WITH_SHA256_OF_THE_5_0_0_PYPI_SOURCE_ARCHIVE
  path: .

build:
  number: 0
  noarch: python
  # A local checkout may not carry the release tag into the build directory.
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SCQUBITS={{ version }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
    - wheel
  run:
    - python >={{ python_min }}
    - cycler
    - dill
    - pathos >=0.3.0
    - matplotlib-base >=3.5.1
    - numpy >=1.14.2
    - qutip >=4.3.1
    - scipy >=1.5
    - sympy
    - threadpoolctl
    - tqdm
    # Include the GUI extra in the Conda package, as in the existing recipe.
    - ipywidgets >=7.5
    - ipyvuetify >=1.8.10,<3
    - ipyvue >=1.7,<2
    - matplotlib-label-lines >=0.3.6
    - h5py >=2.10

test:
  imports:
    - scqubits
  requires:
    - pytest
    - pip
    - python {{ python_min }}
  commands:
    - pytest --pyargs scqubits
    - pip check

about:
  home: https://github.com/scqubits/scqubits
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Superconducting qubits in Python

  description: |
    scqubits is an open-source Python library for simulating superconducting qubits. It is meant to give the user a
    convenient way to obtain energy spectra of common superconducting qubits, plot energy levels as a function of
    external parameters, calculate matrix elements etc. The library further provides an interface to QuTiP, making it
    easy to work with composite Hilbert spaces consisting of coupled superconducting qubits and harmonic modes.
    Internally, numerics within scqubits is carried out with the help of Numpy and Scipy; plotting capabilities rely
    on Matplotlib.
  doc_url: https://scqubits.readthedocs.io/
  dev_url: https://github.com/scqubits/scqubits

extra:
  recipe-maintainers:
    - kochjens
    - petergthatsme
