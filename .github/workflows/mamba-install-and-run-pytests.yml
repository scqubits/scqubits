name: Locally build scqubits with conda-build and run pytests

on:
  workflow_dispatch:

jobs:
  build-all:
    name: scqubits testing (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Conda build tooling
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: build-tools
          python-version: '3.10'
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict

      - name: Install build and lint tools
        # The conda shell function uses base's executable and plugin registry.
        # Installing conda-build only in build-tools does not register `conda build`.
        run: conda install -n base -y --override-channels -c conda-forge conda-build flake8

      - name: Lint with flake8
        run: |
          python -m unittest discover -s tools -p test_ci_package.py
          conda run --no-capture-output -n base python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build conda package and run recipe tests
        run: |
          python -c "import os; from pathlib import Path; Path(os.environ['RUNNER_TEMP'], 'scqubits-conda').mkdir(parents=True, exist_ok=True)"
          conda build . --override-channels -c conda-forge --output-folder "${RUNNER_TEMP}/scqubits-conda"

      - name: Install the exact artifact in a fresh Python environment
        run: python -I tools/ci_package.py conda-install --output "${RUNNER_TEMP}/scqubits-conda" --python-version "${{ matrix.python-version }}"

      - name: Verify installed package and run tests
        run: conda run --no-capture-output -n scqubits-test python -I tools/ci_package.py test --python-version "${{ matrix.python-version }}" --recipe-version --coverage "${RUNNER_TEMP}/scqubits-coverage.xml"

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/scqubits-coverage.xml
          verbose: true
